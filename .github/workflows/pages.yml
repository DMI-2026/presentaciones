name: Deploy slides to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build slides with Marp CLI
        run: |
          mkdir -p dist/semana-02
          npx --yes @marp-team/marp-cli@latest semana-02/patrones-diseno.md \
            -o dist/semana-02/index.html --html

      - name: Add root redirect
        run: |
          cat > dist/index.html << 'HTML'
          <!doctype html>
          <meta http-equiv="refresh" content="0; url=semana-02/">
          HTML

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
