name: Deploy slides to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref to build (use an older commit to roll back)"
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

# Do NOT set cancel-in-progress: true — cancelling mid-deploy can leave the
# published site torn. A queued run is the intended behavior.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Pin the version. "@latest" can major-bump mid-semester and break the build.
  MARP_VERSION: 4.5.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Adjust the glob if this project uses a folder convention other than
      # "semana-NN/". Never hardcode a single filename here.
      - name: Build every deck and copy its local assets
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p dist
          built=0
          for f in semana-*/*.md; do
            src_dir="$(dirname "$f")"
            out_dir="dist/$src_dir"
            mkdir -p "$out_dir"
            npx --yes "@marp-team/marp-cli@${MARP_VERSION}" "$f" \
              -o "$out_dir/index.html" --html
            # marp-cli does NOT copy local assets and does NOT rewrite
            # relative paths, so mirror everything except the Markdown.
            rsync -a --exclude='*.md' "$src_dir/" "$out_dir/"
            built=$((built + 1))
          done
          # A renamed folder must fail loudly, not publish an empty site.
          if [ "$built" -eq 0 ]; then
            echo "::error::No decks matched semana-*/*.md"
            exit 1
          fi
          # Shared assets referenced as ../assets/... from a deck.
          if [ -d assets ]; then
            cp -r assets dist/
          fi

      - name: Build landing page and 404
        run: |
          set -euo pipefail
          {
            echo '<!doctype html><meta charset="utf-8"><title>Presentaciones</title>'
            echo '<h1>Presentaciones</h1><ul>'
            for d in dist/semana-*/; do
              name=$(basename "$d")
              echo "<li><a href=\"$name/\">$name</a></li>"
            done
            echo '</ul>'
          } > dist/index.html
          BASE="${GITHUB_REPOSITORY#*/}"
          printf '<!doctype html><meta charset="utf-8"><title>404</title><h1>404</h1><p><a href="/%s/">Ver todas las presentaciones</a></p>\n' \
            "$BASE" > dist/404.html

      # Do NOT add .nojekyll: the artifact path never runs Jekyll, and
      # upload-pages-artifact strips dotfiles anyway.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
